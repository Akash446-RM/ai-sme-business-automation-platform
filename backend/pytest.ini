[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    unit: isolated business logic tests
    api: HTTP endpoint tests
    integration: tests spanning services and the database
    ml: machine learning pipeline tests
    e2e: full workflow tests
filterwarnings =
    ignore::DeprecationWarning
